name: Fossil CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECTED_FINGERPRINT: "803165AAB1D758132CB0C62CB0D2378FAEB6C781D776A80D3E77374096FEB4C4"

jobs:
  build:
    name: Build + sign + verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: Da25KUVSE5jbGds2zXmfXw==

      - name: Write signing config
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo storePassword="$KEYSTORE_PASSWORD" >> keystore.properties
          echo keyAlias="$KEY_ALIAS" >> keystore.properties
          echo keyPassword="$KEY_PASSWORD" >> keystore.properties
          echo storeFile="$GITHUB_WORKSPACE/key.jks" >> keystore.properties
          echo "$KEYSTORE" | base64 --decode > key.jks

      - name: Build release APK
        run: ./gradlew assembleFossRelease --stacktrace

      - name: Verify signature fingerprint
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | grep -i release | head -1)
          echo "Built: $APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -z "$APKSIGNER" ] && APKSIGNER=$(command -v apksigner)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          ACTUAL=$(grep -oE '([0-9a-fA-F]{2}:){31}[0-9a-fA-F]{2}|[0-9a-fA-F]{64}' /tmp/certs.txt | head -1 | tr -d ':' | tr 'a-f' 'A-F')
          echo "Actual:   $ACTUAL"
          echo "Expected: $EXPECTED_FINGERPRINT"
          if [ "$ACTUAL" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::Signature fingerprint mismatch — build rejected"
            exit 1
          fi
          cp "$APK" Fossil-release.apk

      - uses: actions/upload-artifact@v6
        with:
          name: Fossil-release-apk
          path: Fossil-release.apk

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: rel
        run: |
          VER=$(grep -oP '^VERSION_NAME=\K.*' gradle.properties)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v6
        with:
          name: Fossil-release-apk
          path: apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.rel.outputs.version }}
        run: |
          mv apk/Fossil-release.apk "Fossil-v$VER.apk"
          cat > notes.md <<'EOF'
          ## Fossil v1.0.2 — the liquid glass engine

          - **Real liquid glass** — every popup (long-press menus, wallpaper selector, rename, pickers) now refracts actual launcher content through a rounded-rect lens: displacement refraction, chromatic dispersion, fresnel rim and specular highlight. Live GPU shaders on Android 13+, an identical software render everywhere else — no more tinted layer
          - **Liquid folders** — folder panels are pre-rendered glass surfaces with the same optics
          - **Glass settings** — real blurred wallpaper skin, adaptive day/night scrim
          - **Glass drawer** — actual blurred wallpaper layered under the frosted sheet, works on every device
          - **Launch animation** — apps bloom out of the tapped icon while the launcher recedes
          - **Three home layouts** — classic, all-apps-on-home, drawer-only home
          - **Icon cache** — drawer icons render with zero delay; uninstalled apps drop their cache entries
          - **Counterfeit nag removed** — upstream Fossify's randomized "fake app" warning no longer fires on this legitimate GPL fork

          Modded from [Fossify Launcher](https://github.com/FossifyOrg/Launcher) (GPL-3.0).
          EOF
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "Release v$VER already exists — skipping"
            exit 0
          fi
          gh release create "v$VER" "Fossil-v$VER.apk" --latest --title "Fossil v$VER" --notes-file notes.md
